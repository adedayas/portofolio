<div
  id="portfolio-sidebar"
  class="border-end bg-body"
  aria-label="Informasi profil dan navigasi samping"
>
  <div class="sidebar-content">
    <!-- Bagian utama sidebar -->
    <div class="sidebar-main">
      <!-- Profil -->
      <div class="sidebar-profile text-center mb-4">
        <span
          class="avatar avatar-xl rounded-circle mb-3"
          style="background-image: url(&quot;./assets/img/profile.svg&quot;)"
          role="img"
          aria-label="Foto profil Ade Dayas Eka Prasetyo"
        ></span>

        <!-- Disembunyikan ketika sidebar menyusut -->
        <div class="sidebar-profile-text">
          <h2 class="h3 mb-1">Ade Dayas Eka Prasetyo</h2>

          <p class="text-secondary mb-0">
            Mahasiswa Sistem Informasi - Universitas Terbuka
          </p>
        </div>
      </div>

      <!-- Fokus -->
      <div class="sidebar-focus card card-sm mb-3">
        <div class="card-body">
          <div class="text-secondary small mb-2">Fokus</div>

          <div class="fw-semibold">IT Support</div>
        </div>
      </div>

      <!-- Menu sidebar -->
      <nav
        class="sidebar-menu list-group list-group-transparent"
        aria-label="Menu sidebar"
      >
        <!-- Status -->
        <div class="list-group-item" title="Open to Work">
          <span class="sidebar-menu-icon" aria-hidden="true">
            <i class="ti ti-briefcase"></i>
          </span>

          <span class="sidebar-menu-text"> Status </span>

          <span class="sidebar-menu-value badge bg-green-lt">
            Open to Work
          </span>
        </div>

        <!-- Lokasi -->
        <div class="list-group-item" title="Lokasi: Indonesia">
          <span class="sidebar-menu-icon" aria-hidden="true">
            <i class="ti ti-map-pin"></i>
          </span>

          <span class="sidebar-menu-text"> Lokasi </span>

          <span class="sidebar-menu-value text-secondary">
            Cilacap, Indonesia
          </span>
        </div>

        <!-- Keahlian -->
        <a href="#keahlian" class="list-group-item list-group-item-action">
          <span class="sidebar-menu-icon" aria-hidden="true">
            <i class="ti ti-tools"></i>
          </span>

          <span class="sidebar-menu-text"> Lihat Keahlian </span>
        </a>

        <!-- Proyek -->
        <a href="#proyek" class="list-group-item list-group-item-action">
          <span class="sidebar-menu-icon" aria-hidden="true">
            <i class="ti ti-folders"></i>
          </span>

          <span class="sidebar-menu-text"> Lihat Proyek </span>
        </a>

        <!-- Galeri -->
        <a
          href="#galeri"
          class="list-group-item list-group-item-action"
          title="Galeri"
        >
          <span class="sidebar-menu-icon" aria-hidden="true">
            <i class="ti ti-photo"></i>
          </span>

          <span class="sidebar-menu-text"> Galeri </span>
        </a>

        <!-- Kontak -->
        <a href="#kontak" class="list-group-item list-group-item-action">
          <span class="sidebar-menu-icon" aria-hidden="true">
            <i class="ti ti-mail"></i>
          </span>

          <span class="sidebar-menu-text"> Hubungi Saya </span>
        </a>
      </nav>
    </div>

    <!-- Media sosial di bagian bawah -->
    <div class="sidebar-social border-top">
      <p class="sidebar-social-title text-secondary small mb-2">Media sosial</p>

      <div class="sidebar-social-links d-flex flex-wrap gap-2">
        <!-- GitHub -->
        <a
          href="https://github.com/adedayas"
          class="btn btn-sm btn-outline-secondary"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="ti ti-brand-github" aria-hidden="true"></i>

          <span class="sidebar-social-text"> GitHub </span>
        </a>

        <!-- LinkedIn -->
        <a
          href="https://www.linkedin.com/in/adedayas12"
          class="btn btn-sm btn-outline-secondary"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="ti ti-brand-linkedin" aria-hidden="true"></i>

          <span class="sidebar-social-text"> LinkedIn </span>
        </a>

        <!-- Instagram -->
        <a
          href="https://www.instagram.com/adedayas/"
          class="btn btn-sm btn-outline-secondary"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="ti ti-brand-instagram" aria-hidden="true"></i>

          <span class="sidebar-social-text"> Instagram </span>
        </a>
      </div>
    </div>
  </div>
</div>
