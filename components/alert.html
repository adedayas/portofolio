<div
  id="portfolio-alert"
  class="alert alert-info alert-dismissible d-none"
  role="alert"
  aria-live="polite"
>
  <div class="d-flex">
    <div class="me-3">
      <i id="alert-icon" class="ti ti-info-circle" aria-hidden="true"></i>
    </div>

    <div>
      <h4 id="alert-title" class="alert-title mb-1">Informasi</h4>

      <div id="alert-message">Pesan pemberitahuan akan tampil di sini.</div>
    </div>
  </div>

  <button
    type="button"
    class="btn-close"
    data-bs-dismiss="alert"
    aria-label="Tutup pemberitahuan"
  ></button>
</div>
